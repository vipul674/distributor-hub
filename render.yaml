services:
  - type: web
    name: distributor-hub
    runtime: node
    rootDir: .
    buildCommand: npm install && npm --prefix server install && npm run build
    startCommand: npm --prefix server run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CORS_ORIGIN
        sync: false
      - key: MODEL_DIR
        value: ../Retail_Models_Onnx
      - key: DATA_MODE
        value: auto
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: supplyDesk
      - key: JWT_SECRET
        generateValue: true
